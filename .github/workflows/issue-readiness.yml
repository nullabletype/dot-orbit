name: Issue readiness

on:
  issues:
    types: [closed, edited, labeled, reopened, unlabeled]
  workflow_dispatch:

concurrency:
  group: issue-readiness
  cancel-in-progress: false

permissions: {}

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Restore locked dependencies
        run: dotnet restore tools/DotOrbit.IssueReadiness/DotOrbit.IssueReadiness.csproj --locked-mode
      - name: Preview readiness transitions
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dotnet run
          --project tools/DotOrbit.IssueReadiness/DotOrbit.IssueReadiness.csproj
          --no-restore
          --
          --dry-run

  reconcile:
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Restore locked dependencies
        run: dotnet restore tools/DotOrbit.IssueReadiness/DotOrbit.IssueReadiness.csproj --locked-mode
      - name: Reconcile readiness labels
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dotnet run
          --project tools/DotOrbit.IssueReadiness/DotOrbit.IssueReadiness.csproj
          --no-restore
