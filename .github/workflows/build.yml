name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: windows-2025
            runtime: win-x64
          - os: macos-26
            runtime: osx-arm64
          - os: macos-26-intel
            runtime: osx-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Verify NuGet source policy
        run: node .github/scripts/security-controls.mjs nuget-policy
      - name: Verify workflow artifact policy
        if: matrix.os == 'ubuntu-24.04'
        run: node .github/scripts/security-controls.mjs artifact-policy
      - name: Test security controls
        if: matrix.os == 'ubuntu-24.04'
        run: node --test .github/scripts/security-controls.test.mjs
      - name: Test issue-readiness script
        if: matrix.os == 'ubuntu-24.04'
        run: node --test .github/scripts/issue-readiness.test.mjs
      - name: Test release controls
        if: matrix.os == 'ubuntu-24.04'
        run: node --test .github/scripts/release-controls.test.mjs
      - name: Test Orbit agent-evaluation cases
        run: node --test evaluations/agent-loop/cases.test.mjs
      - name: Run repository verification gate
        env:
          DOTORBIT_REQUIRE_OTHER_USER_TEST: ${{ matrix.os == 'ubuntu-24.04' && '1' || '0' }}
        run: >-
          dotnet run
          --project tools/DotOrbit.Verification/DotOrbit.Verification.csproj
          -p:RestoreLockedMode=true
          --
          --evidence
          --expected-sha "${{ github.sha }}"
