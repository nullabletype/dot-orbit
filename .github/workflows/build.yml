name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Restore locked dependencies
        run: dotnet restore DotOrbit.slnx --locked-mode
      - name: Verify formatting
        run: dotnet format DotOrbit.slnx --no-restore --verify-no-changes
      - name: Build
        run: dotnet build DotOrbit.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test --solution DotOrbit.slnx --configuration Release --no-build
