name: Release packages

on:
  pull_request:
    paths:
      - .github/workflows/release-packages.yml
      - Directory.Build.props
      - Directory.Packages.props
      - DotOrbit.slnx
      - LICENSE
      - THIRD-PARTY-NOTICES.md
      - global.json
      - licenses/**
      - src/**
      - tools/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-smoke:
    name: ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            runtime: win-x64
            archive: dot-orbit-win-x64.zip
            smoke-command: ./artifacts/package-smoke/win-x64/dot-orbit.exe --package-smoke
          - os: ubuntu-24.04
            runtime: linux-x64
            archive: dot-orbit-linux-x64.tar.gz
            smoke-command: xvfb-run --auto-servernum ./artifacts/package-smoke/linux-x64/dot-orbit --package-smoke
          - os: macos-26-intel
            runtime: osx-x64
            archive: dot-orbit-osx-x64.tar.gz
            smoke-command: ./artifacts/package-smoke/osx-x64/dot-orbit --package-smoke
          - os: macos-26
            runtime: osx-arm64
            archive: dot-orbit-osx-arm64.tar.gz
            smoke-command: ./artifacts/package-smoke/osx-arm64/dot-orbit --package-smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Restore locked dependencies
        run: dotnet restore DotOrbit.slnx --locked-mode
      - name: Assemble and validate package
        run: >-
          dotnet run
          --project tools/DotOrbit.Packaging/DotOrbit.Packaging.csproj
          --configuration Release
          --no-restore
          --
          --repository-root .
          --runtime ${{ matrix.runtime }}
          --no-restore
      - name: Run packaged encrypted desktop smoke
        timeout-minutes: 2
        shell: bash
        run: ${{ matrix.smoke-command }}
      - name: Upload approved release package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: artifacts/packages/${{ matrix.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 7
