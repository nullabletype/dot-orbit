name: Release packages

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - .github/scripts/release-controls.mjs
      - .github/scripts/release-controls.test.mjs
      - .github/workflows/release-packages.yml
      - Directory.Build.props
      - Directory.Packages.props
      - DotOrbit.slnx
      - LICENSE
      - NuGet.Config
      - THIRD-PARTY-NOTICES.md
      - global.json
      - licenses/**
      - src/**
      - tests/DotOrbit.Storage.Sqlite.Tests/**
      - tools/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admit-source:
    name: Admit package source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      upload: ${{ steps.source.outputs.upload }}
      draft-release: ${{ steps.source.outputs.draft-release }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Check out repository and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Test release controls
        run: node --test .github/scripts/release-controls.test.mjs
      - name: Classify package source
        id: source
        run: node .github/scripts/release-controls.mjs classify

  package-and-smoke:
    name: ${{ matrix.runtime }}
    needs: admit-source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            runtime: win-x64
            archive: dot-orbit-win-x64.zip
            smoke-command: ./artifacts/package-smoke/win-x64/dot-orbit.exe --package-smoke
          - os: ubuntu-24.04
            runtime: linux-x64
            archive: dot-orbit-linux-x64.tar.gz
            smoke-command: xvfb-run --auto-servernum --auth-file=artifacts/package-smoke/linux-x64/dot-orbit-xvfb.auth ./artifacts/package-smoke/linux-x64/dot-orbit --package-smoke
          - os: macos-26-intel
            runtime: osx-x64
            archive: dot-orbit-osx-x64.tar.gz
            smoke-command: ./artifacts/package-smoke/osx-x64/dot-orbit --package-smoke
          - os: macos-26
            runtime: osx-arm64
            archive: dot-orbit-osx-arm64.tar.gz
            smoke-command: ./artifacts/package-smoke/osx-arm64/dot-orbit --package-smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Verify NuGet source policy
        run: node .github/scripts/security-controls.mjs nuget-policy
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Restore locked dependencies
        run: dotnet restore DotOrbit.slnx --locked-mode --configfile NuGet.Config
      - name: Verify portable encrypted recovery
        run: >-
          dotnet test
          --project tests/DotOrbit.Storage.Sqlite.Tests/DotOrbit.Storage.Sqlite.Tests.csproj
          --configuration Release
          --filter-method "*CheckedInRecoveryFixtureRestoresOnEverySupportedRuntime*"
      - name: Assemble and validate package
        run: >-
          dotnet run
          --project tools/DotOrbit.Packaging/DotOrbit.Packaging.csproj
          --configuration Release
          --no-restore
          --
          --repository-root .
          --runtime ${{ matrix.runtime }}
          --version ${{ needs.admit-source.outputs.version }}
          --no-restore
      - name: Run packaged encrypted desktop smoke
        timeout-minutes: 2
        shell: bash
        env:
          DOTORBIT_PACKAGE_SMOKE_RECOVERY: ${{ github.workspace }}/tests/DotOrbit.Storage.Sqlite.Tests/Fixtures/portable-current-v12.dotorbit-recovery
          DOTORBIT_PACKAGE_SMOKE_VERSION: ${{ needs.admit-source.outputs.version }}
        run: ${{ matrix.smoke-command }}
      - name: Upload approved release package
        if: needs.admit-source.outputs.upload == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: artifacts/packages/${{ matrix.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 7

  prepare-draft-release:
    name: Prepare draft release
    if: needs.admit-source.outputs.draft-release == 'true'
    needs:
      - admit-source
      - package-and-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Download validated release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dot-orbit-*
          merge-multiple: true
          skip-decompress: true
          path: artifacts/release-assets
      - name: Create or refresh draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ASSET_ROOT: artifacts/release-assets
        run: node .github/scripts/release-controls.mjs draft-release
