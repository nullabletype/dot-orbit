name: Implementation slice proposal
description: Propose a bounded implementation slice for maintainer triage and readiness review.
title: ""
labels:
  - needs-triage
  - implementation-slice
body:
  - type: dropdown
    id: readiness_contract
    attributes:
      label: Readiness contract
      description: This version marker admits the submitted form to readiness automation after maintainer review.
      options:
        - dot-orbit-issue-readiness:v1
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: User-visible outcome
      description: What becomes possible when this issue is complete?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable statements.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What nearby work is deliberately excluded?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Domain and decision context
      description: Link relevant requirements, CONTEXT sections, and ADRs.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Known constraints
      description: Record relevant technical, security, support, delivery, and sequencing constraints, or write "None".
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Required automated checks, manual behaviour checks, and evidence.
      placeholder: |
        - Automated:
        - Manual:
        - Evidence:
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Open decisions
      description: Record any decision that could materially change implementation, or write exactly "None".
    validations:
      required: true
  - type: textarea
    id: blocked_by
    attributes:
      label: Blocked by
      description: Write exactly "None" or one local issue per line as "- #123". References elsewhere are not dependencies.
      placeholder: |
        None
    validations:
      required: true
