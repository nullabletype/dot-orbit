<!doctype html>
<!-- Three variants of the personal task workspace, switchable via ?variant=, on this prototype route. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Three clickable desktop UI directions for a personal project and task manager.">
  <title>dot-orbit — personal projects</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b0d12'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23ff4fa3' stroke-width='3'/%3E%3Ccircle cx='22' cy='10' r='3' fill='%237ce7b2'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --panel: #10131a;
      --panel-2: #151922;
      --panel-3: #1a1f29;
      --line: #272d39;
      --line-soft: #1d222c;
      --text: #f2f4f7;
      --muted: #9099a9;
      --quiet: #626b7a;
      --mint: #ff4fa3;
      --success: #7ce7b2;
      --amber: #ffb86b;
      --blue: #8bb8ff;
      --violet: #b49cff;
      --rose: #ff93a7;
      --radius: 14px;
      --shadow: 0 18px 60px rgba(0,0,0,.35);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1020px; background: var(--bg); color: var(--text); overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
    .app { height: 100vh; display: grid; grid-template-columns: 228px minmax(560px, 1fr) 320px; grid-template-rows: 64px 1fr; }
    .topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 0 22px; border-bottom: 1px solid var(--line); background: rgba(9,11,16,.94); backdrop-filter: blur(18px); z-index: 20; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: -.02em; min-width: 188px; }
    .brand-mark { width: 27px; height: 27px; border: 2px solid var(--mint); border-radius: 50%; position: relative; box-shadow: inset 0 0 0 5px var(--bg); }
    .brand-mark::after { content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%; right: -3px; top: -3px; background: var(--success); box-shadow: 0 0 0 3px var(--bg); }
    .topbar > .direction-switcher { display: none; }
    .direction-switcher { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .direction-switcher button { border: 0; background: transparent; color: var(--muted); padding: 7px 11px; border-radius: 7px; cursor: pointer; font-size: 13px; }
    .direction-switcher button.active { background: var(--panel-3); color: var(--text); box-shadow: 0 1px 0 rgba(255,255,255,.05); }
    .direction-note { font-size: 13px; color: var(--muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .search-button, .add-button, .icon-button { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; min-height: 36px; cursor: pointer; }
    .search-button { color: var(--muted); padding: 0 12px; }
    .add-button { border-color: transparent; background: var(--mint); color: #280014; font-weight: 750; padding: 0 14px; }
    .sidebar { grid-column: 1; grid-row: 2; padding: 18px 12px; border-right: 1px solid var(--line); background: #0c0f15; overflow: auto; }
    .nav-label { padding: 4px 12px 10px; color: var(--quiet); font-size: 11px; text-transform: uppercase; letter-spacing: .13em; font-weight: 700; }
    .nav { display: grid; gap: 4px; }
    .nav button { border: 0; background: transparent; color: var(--muted); border-radius: 9px; display: grid; grid-template-columns: 23px 1fr auto; align-items: center; text-align: left; padding: 10px 11px; cursor: pointer; font-size: 14px; }
    .nav button:hover { background: var(--panel); color: var(--text); }
    .nav button.active { background: #25131f; color: var(--mint); }
    .nav .nav-icon { font-size: 15px; text-align: center; }
    .count { font-size: 12px; color: var(--quiet); font-variant-numeric: tabular-nums; }
    .sidebar-foot { margin-top: 28px; padding: 14px 12px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 13px; line-height: 1.5; }
    .sidebar-foot strong { color: var(--text); display: block; font-size: 14px; margin-bottom: 2px; }
    .main { grid-column: 2; grid-row: 2; overflow: auto; padding: 30px 32px 60px; }
    .inspector { grid-column: 3; grid-row: 2; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 24px 22px; }
    .inspector.empty { display: grid; place-items: center; color: var(--quiet); text-align: center; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .eyebrow { color: var(--mint); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 750; margin-bottom: 7px; }
    h1 { font-size: 31px; line-height: 1.1; letter-spacing: -.04em; margin: 0; }
    .subtitle { color: var(--muted); margin: 8px 0 0; font-size: 14px; }
    .view-actions { display: flex; gap: 8px; }
    .ghost { border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 8px 11px; border-radius: 8px; cursor: pointer; }
    .category-section { margin-bottom: 30px; }
    .category-title { display: flex; align-items: center; gap: 9px; margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .09em; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cat, var(--mint)); }
    .project-card { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; transition: border .18s, transform .18s; }
    .project-card:hover { border-color: #3a4251; }
    .project-summary { display: grid; grid-template-columns: 18px 28px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 15px 16px; cursor: pointer; }
    .chevron { color: var(--quiet); transition: transform .18s; font-size: 18px; }
    .project-card.open .chevron { transform: rotate(90deg); }
    .project-title { font-weight: 690; letter-spacing: -.01em; }
    .project-meta { display: flex; gap: 12px; color: var(--muted); font-size: 13px; margin-top: 5px; align-items: center; }
    .progress { width: 70px; height: 5px; background: #252b36; border-radius: 9px; overflow: hidden; }
    .progress span { display: block; height: 100%; background: var(--success); border-radius: inherit; }
    .due { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .project-tasks { display: none; border-top: 1px solid var(--line-soft); padding: 7px 10px 10px 52px; }
    .project-card.open .project-tasks { display: block; }
    .task-row { display: grid; grid-template-columns: 18px 28px minmax(0,1fr) auto auto auto; align-items: center; gap: 10px; min-height: 48px; border-bottom: 1px solid var(--line-soft); padding: 3px 6px; cursor: pointer; }
    .task-row:last-child { border-bottom: 0; }
    .task-row:hover { background: rgba(255,255,255,.025); }
    .task-row.done .task-name { text-decoration: line-through; color: var(--quiet); }
    .check { width: 19px; height: 19px; border: 1.5px solid #4a5363; border-radius: 6px; background: transparent; cursor: pointer; display: grid; place-items: center; color: #0c1512; padding: 0; }
    .done .check, .check.checked { border-color: var(--success); background: var(--success); }
    .check.checked::after, .done .check::after { content: "✓"; font-size: 13px; font-weight: 900; }
    .task-name { font-size: 14px; }
    .task-sub { color: var(--quiet); font-size: 12px; margin-top: 3px; }
    .badge { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); color: var(--muted); padding: 4px 7px; border-radius: 20px; font-size: 11px; white-space: nowrap; }
    .badge.override { border-color: color-mix(in srgb, var(--amber) 40%, transparent); color: var(--amber); }
    .status-pill { display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:12px; white-space:nowrap; }
    .status-pill::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--quiet); }
    .status-pill.in-progress::before { background:var(--amber); }
    .status-pill.complete { color:var(--success); }
    .status-pill.complete::before { background:var(--success); }
    .drag-handle { border: 0; background: transparent; color: #596272; padding: 4px 0; cursor: grab; font-size: 14px; line-height: 1; user-select: none; touch-action: none; }
    .drag-handle:active { cursor: grabbing; color: var(--mint); }
    [draggable="true"].dragging { opacity: .35; }
    [draggable="true"].drop-before { box-shadow: inset 0 2px 0 var(--mint); }
    [draggable="true"].drop-after { box-shadow: inset 0 -2px 0 var(--mint); }
    .today-star { border: 0; background: transparent; color: var(--quiet); cursor: pointer; font-size: 18px; }
    .today-star.active { color: var(--amber); }
    .list { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 4px 10px; }
    .list .task-row { grid-template-columns: 18px 28px minmax(0,1fr) auto auto auto; }
    .task-row.compact { grid-template-columns: 18px 28px minmax(0,1fr) auto auto; }
    .group-head { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; font-weight: 700; margin: 24px 0 10px; }
    .group-head::after { content: ""; height: 1px; background: var(--line); flex: 1; }
    .empty-state { border: 1px dashed var(--line); border-radius: var(--radius); padding: 44px; text-align: center; color: var(--muted); }
    .archive-search { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 0 14px; margin-bottom: 18px; }
    .archive-search input { flex: 1; background: transparent; border: 0; color: var(--text); height: 48px; outline: none; }
    .archive-item { border-bottom: 1px solid var(--line-soft); padding: 15px 4px; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .archive-item:last-child { border-bottom: 0; }
    .archive-item p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .inspector h2 { font-size: 20px; line-height: 1.25; letter-spacing: -.025em; margin: 6px 0 8px; }
    .inspector-top { display: flex; justify-content: space-between; align-items: center; }
    .icon-button { width: 34px; color: var(--muted); }
    .inspector-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
    .inspector-label { color: var(--quiet); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 750; margin-bottom: 9px; }
    .description { color: #c8ced8; line-height: 1.65; font-size: 14px; }
    .description h1, .description h2, .description h3 { font-size: 16px; margin: 12px 0 5px; letter-spacing: 0; }
    .description p { margin: 6px 0; }
    .description code { color: var(--mint); background: #0b0e13; padding: 2px 5px; border-radius: 4px; }
    .editable-title { display: block; width: 100%; color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 7px; font-weight: 750; font-size: 20px; line-height: 1.25; margin: 6px 0 8px; padding: 5px 7px; }
    .editable-title:hover, .field-input:hover, .field-select:hover, .inline-markdown:hover { border-color: #414958; }
    .field-input, .field-select { width: 100%; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px; }
    .inline-markdown { width: 100%; min-height: 122px; color: #d7dbe2; background: #0b0e13; border: 1px solid var(--line); border-radius: 9px; padding: 11px; resize: vertical; line-height: 1.55; font-size: 13px; }
    .preview-head { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 6px; }
    .copy-rich { border: 1px solid color-mix(in srgb, var(--mint) 45%, var(--line)); background: color-mix(in srgb, var(--mint) 10%, var(--panel)); color: #ff8bc3; border-radius: 7px; padding: 6px 9px; cursor: pointer; font-size: 12px; }
    .rendered-preview { border-left: 2px solid var(--mint); padding: 2px 0 2px 12px; }
    .hint { color: var(--quiet); font-size: 11px; margin-top: 6px; }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .meta-value { color: var(--text); font-size: 14px; }
    .participants { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .avatar { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 50%; background: var(--panel-3); border: 1px solid #3b4351; font-size: 11px; font-weight: 800; }
    .person-name { font-size: 13px; color: var(--muted); }
    .inspector-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }
    .inspector-actions button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px; padding: 10px; cursor: pointer; }
    .inspector-actions .primary { color: #280014; background: var(--mint); border-color: transparent; font-weight: 750; }
    dialog { width: min(660px, calc(100vw - 60px)); border: 1px solid #343c49; background: var(--panel); color: var(--text); border-radius: 16px; box-shadow: var(--shadow); padding: 0; }
    dialog::backdrop { background: rgba(3,5,8,.72); backdrop-filter: blur(4px); }
    .modal-head { padding: 20px 22px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 18px; }
    .modal-tabs { display: flex; gap: 5px; }
    .modal-tabs button { border: 0; background: transparent; color: var(--muted); padding: 6px 9px; cursor: pointer; border-radius: 7px; }
    .modal-tabs button.active { color: var(--text); background: var(--panel-3); }
    .modal-body { padding: 22px; }
    .modal-body textarea { width: 100%; min-height: 260px; border: 1px solid var(--line); border-radius: 10px; background: #0b0e13; color: var(--text); padding: 15px; resize: vertical; line-height: 1.6; }
    .modal-foot { padding: 15px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
    .modal-foot button { border: 1px solid var(--line); background: var(--panel-2); padding: 9px 14px; border-radius: 8px; cursor: pointer; }
    .modal-foot .save { background: var(--mint); color: #092117; border-color: transparent; font-weight: 750; }
    .toast { position: fixed; left: 50%; bottom: 82px; transform: translate(-50%, 20px); background: #ffe7f3; color: #3b0a23; border-radius: 9px; padding: 11px 15px; font-size: 13px; font-weight: 650; opacity: 0; pointer-events: none; transition: .2s; z-index: 100; box-shadow: var(--shadow); }
    .toast.show { opacity: 1; transform: translate(-50%,0); }
    .prototype-switcher { position: fixed; z-index: 90; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 5px; background: #f7f7fa; color: #1b1d24; border-radius: 999px; padding: 5px; box-shadow: 0 12px 38px rgba(0,0,0,.45); }
    .prototype-switcher button { border: 0; background: transparent; color: inherit; min-width: 34px; height: 34px; border-radius: 50%; cursor: pointer; }
    .prototype-switcher button:hover { background: #e7e8ed; }
    .prototype-switcher strong { min-width: 180px; text-align: center; font: 650 12px/1.2 Inter, sans-serif; }

    /* Direction 2: cards become the main navigation and the inspector floats. */
    body[data-direction="canvas"] { --bg: #0e0c14; --panel: #16131e; --panel-2: #1d1927; --panel-3: #252030; --line: #332d40; --line-soft: #282332; --mint: #ff4fa3; --success: #a9ef75; --amber: #ffcf70; --radius: 20px; }
    body[data-direction="canvas"] .app { grid-template-columns: 92px minmax(720px,1fr); }
    body[data-direction="canvas"] .brand { min-width: 50px; }
    body[data-direction="canvas"] .brand span:last-child { display: none; }
    body[data-direction="canvas"] .sidebar { padding: 18px 10px; }
    body[data-direction="canvas"] .nav-label, body[data-direction="canvas"] .sidebar-foot { display: none; }
    body[data-direction="canvas"] .nav button { grid-template-columns: 1fr; justify-items: center; gap: 5px; padding: 10px 4px; font-size: 11px; }
    body[data-direction="canvas"] .nav .nav-icon { font-size: 19px; }
    body[data-direction="canvas"] .nav .count { display: none; }
    body[data-direction="canvas"] .main { grid-column: 2; padding-right: 40px; }
    body[data-direction="canvas"] .inspector { position: fixed; right: 22px; top: 80px; bottom: 22px; width: 340px; z-index: 15; border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); transform: translateX(calc(100% + 42px)); transition: transform .24s ease; }
    body[data-direction="canvas"] .inspector.has-selection { transform: none; }
    body[data-direction="canvas"] .category-section { display: grid; grid-template-columns: repeat(2, minmax(280px,1fr)); gap: 12px; }
    body[data-direction="canvas"] .category-title { grid-column: 1 / -1; margin-top: 8px; }
    body[data-direction="canvas"] .project-card { margin: 0; min-height: 126px; }
    body[data-direction="canvas"] .project-summary { padding: 20px; align-items: start; }
    body[data-direction="canvas"] .project-tasks { padding-left: 18px; }

    /* Direction 3: dense, keyboard-friendly ledger. */
    body[data-direction="ledger"] { --bg: #070d12; --panel: #0b141c; --panel-2: #101c26; --panel-3: #172631; --line: #213440; --line-soft: #182934; --mint: #ff4fa3; --success: #78e6b3; --amber: #ffc857; --radius: 4px; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    body[data-direction="ledger"] .app { grid-template-columns: minmax(780px,1fr) 340px; grid-template-rows: 106px 1fr; }
    body[data-direction="ledger"] .topbar { grid-column: 1 / -1; display: grid; grid-template-columns: 170px 1fr auto; grid-template-rows: 52px 44px; padding: 0 18px; }
    body[data-direction="ledger"] .brand { min-width: 0; }
    body[data-direction="ledger"] .direction-note { font-size: 12px; }
    body[data-direction="ledger"] .direction-switcher { justify-self: center; }
    body[data-direction="ledger"] .top-actions { justify-self: end; }
    body[data-direction="ledger"] .sidebar { grid-column: 1 / -1; grid-row: 2; height: 44px; position: fixed; top: 61px; left: 0; right: 0; z-index: 30; padding: 0 18px; border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
    body[data-direction="ledger"] .nav-label, body[data-direction="ledger"] .sidebar-foot { display: none; }
    body[data-direction="ledger"] .nav { display: flex; height: 43px; }
    body[data-direction="ledger"] .nav button { display: flex; gap: 7px; border-radius: 0; padding: 0 16px; border-bottom: 2px solid transparent; }
    body[data-direction="ledger"] .nav button.active { background: transparent; border-bottom-color: var(--mint); }
    body[data-direction="ledger"] .main { grid-column: 1; grid-row: 2; padding: 24px; }
    body[data-direction="ledger"] .inspector { grid-column: 2; grid-row: 2; }
    body[data-direction="ledger"] .project-card, body[data-direction="ledger"] .list { border-left: 3px solid var(--cat, var(--line)); }
    body[data-direction="ledger"] .project-card { margin-bottom: 4px; }
    body[data-direction="ledger"] .project-summary { padding: 11px 12px; }
    body[data-direction="ledger"] .task-row { min-height: 42px; }
    body[data-direction="ledger"] h1 { font-size: 25px; }
    body[data-direction="ledger"] .page-head { margin-bottom: 18px; }

    @media (max-width: 1120px) {
      .app { grid-template-columns: 205px minmax(560px,1fr); }
      .inspector { position: fixed; right: 18px; top: 78px; bottom: 18px; width: 330px; z-index: 40; box-shadow: var(--shadow); border: 1px solid var(--line); border-radius: 14px; transform: translateX(calc(100% + 40px)); transition: transform .2s; }
      .inspector.has-selection { transform: none; }
      .direction-note { display: none; }
    }
  </style>
</head>
<body data-direction="workbench">
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>dot-orbit</span></div>
      <div class="direction-switcher" aria-label="Design direction">
        <button class="active" data-direction="workbench" title="Balanced three-column workspace">Workbench</button>
        <button data-direction="canvas" title="Visual project card canvas">Canvas</button>
        <button data-direction="ledger" title="Dense keyboard-friendly layout">Ledger</button>
      </div>
      <div class="direction-note" id="directionNote">Calm three-pane workspace · context stays visible</div>
      <div class="top-actions">
        <button class="search-button" id="jumpSearch" aria-label="Go to archive search">⌕ Search</button>
        <button class="add-button" id="newTask">＋ New task</button>
      </div>
    </header>
    <aside class="sidebar">
      <div class="nav-label">Workspace</div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot"><strong id="focusCount">3 tasks today</strong><span>One overdue · 2h 15m planned</span></div>
    </aside>
    <main class="main" id="main"></main>
    <aside class="inspector empty" id="inspector"><div>Select a project or task<br>to see its details</div></aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="prototype-switcher" aria-label="Prototype variant switcher">
    <button id="previousVariant" aria-label="Previous design direction">←</button>
    <strong id="variantLabel">A — Workbench</strong>
    <button id="nextVariant" aria-label="Next design direction">→</button>
  </div>

  <script>
    const categories = {
      Work: { color: '#8ce6c0' }, Personal: { color: '#8bb8ff' }, Home: { color: '#ffb86b' }, Learning: { color: '#b49cff' }
    };
    const projects = [
      { id:'p1', title:'Q4 planning', category:'Work', due:'Oct 04', description:'## Outcome\nShape the next quarter around **three clear bets**.\n\nKeep the plan short enough to revisit weekly.', open:true, tasks:['t1','t2','t3'] },
      { id:'p2', title:'Studio refresh', category:'Home', due:'Oct 12', description:'## Aim\nMake the room calmer and improve the video-call background.\n\n- Better task lighting\n- Clear the cable run', open:false, tasks:['t4','t5'] },
      { id:'p3', title:'TypeScript course', category:'Learning', due:'Oct 18', description:'Finish the advanced modules and build a small `Result` type example.', open:false, tasks:['t6','t7','t8'] },
      { id:'p4', title:'Autumn break', category:'Personal', due:'Oct 25', description:'A few days away with no packed itinerary.', open:false, tasks:['t9','t10'] }
    ];
    const tasks = [

    let dragState=null;
    function bindDragAndDrop(){
      main.querySelectorAll('[draggable="true"]').forEach(el=>{
        el.ondragstart=e=>{ dragState={scope:el.dataset.reorderScope,id:el.dataset.task||el.dataset.reorderId,projectId:el.dataset.projectScope}; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; };
        el.ondragover=e=>{ if(!dragState||dragState.scope!==el.dataset.reorderScope||dragState.id===(el.dataset.task||el.dataset.reorderId))return; if(dragState.scope==='project-task'&&dragState.projectId!==el.dataset.projectScope)return; e.preventDefault(); clearDropMarks(); const before=e.clientY<el.getBoundingClientRect().top+el.getBoundingClientRect().height/2; el.classList.add(before?'drop-before':'drop-after'); };

      main.querySelectorAll('.drag-handle').forEach(handle=>{
        handle.onpointerdown=e=>{
          e.preventDefault(); const sourceEl=handle.closest('[data-reorder-scope]'); if(!sourceEl||sourceEl.dataset.reorderScope==='none')return;
          const pointerDrag={scope:sourceEl.dataset.reorderScope,id:sourceEl.dataset.task||sourceEl.dataset.reorderId,projectId:sourceEl.dataset.projectScope}; sourceEl.classList.add('dragging'); handle.setPointerCapture(e.pointerId);
          handle.onpointermove=move=>{ clearDropMarks(); sourceEl.classList.add('dragging'); const target=document.elementFromPoint(move.clientX,move.clientY)?.closest(`[data-reorder-scope="${pointerDrag.scope}"]`); if(!target||target===sourceEl||(pointerDrag.scope==='project-task'&&pointerDrag.projectId!==target.dataset.projectScope))return; const before=move.clientY<target.getBoundingClientRect().top+target.getBoundingClientRect().height/2; target.classList.add(before?'drop-before':'drop-after'); };
          handle.onpointerup=up=>{ const target=document.elementFromPoint(up.clientX,up.clientY)?.closest(`[data-reorder-scope="${pointerDrag.scope}"]`); const targetId=target&&(target.dataset.task||target.dataset.reorderId); const before=target?.classList.contains('drop-before'); handle.releasePointerCapture(up.pointerId); handle.onpointermove=null; handle.onpointerup=null; if(target&&target!==sourceEl&&!(pointerDrag.scope==='project-task'&&pointerDrag.projectId!==target.dataset.projectScope)) reorderItems(pointerDrag.scope,pointerDrag.id,targetId,before,pointerDrag.projectId); else clearDropMarks(); };
        };

    function clearDropMarks(){ main.querySelectorAll('.dragging,.drop-before,.drop-after').forEach(el=>el.classList.remove('dragging','drop-before','drop-after')); }
    function moved(ids,source,target,before){ const next=ids.filter(id=>id!==source), index=next.indexOf(target); next.splice(before?index:index+1,0,source); return next; }

    function toggleDone(id){

    async function copyRendered(element){
      const html=element.innerHTML, text=element.innerText;

        if(navigator.clipboard?.write && window.ClipboardItem){ await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]); }

      } catch {
        const temp=document.createElement('div'); temp.contentEditable='true'; temp.style.position='fixed'; temp.style.left='-9999px'; temp.innerHTML=html; document.body.append(temp); const range=document.createRange(); range.selectNodeContents(temp); const selection=getSelection(); selection.removeAllRanges(); selection.addRange(range); document.execCommand('copy'); selection.removeAllRanges(); temp.remove();

      if(updateUrl){ const url=new URL(location.href); url.searchParams.set('variant',variant.key); history.replaceState({},'',url); }
    }
    function cycleVariant(delta){ const current=variants.findIndex(v=>v.key===document.body.dataset.direction); setVariant(variants[(current+delta+variants.length)%variants.length].key); }
    document.querySelectorAll('.direction-switcher [data-direction]').forEach(b=>b.onclick=()=>setVariant(b.dataset.direction));
    $('#previousVariant').onclick=()=>cycleVariant(-1); $('#nextVariant').onclick=()=>cycleVariant(1);
    $('#jumpSearch').onclick=()=>{state.view='archive';state.selected=null;render();};
    $('#newTask').onclick=()=>toast('New task flow would open here');
    document.addEventListener('keydown',e=>{ const editing=e.target.matches('input,textarea,select,[contenteditable]'); if(e.key==='Escape'&&!editing) clearSelection(); if(e.key==='/'&&!editing){ e.preventDefault(); state.view='archive'; render(); } if(!editing&&e.key==='ArrowLeft')cycleVariant(-1); if(!editing&&e.key==='ArrowRight')cycleVariant(1); });
    setVariant(new URLSearchParams(location.search).get('variant')||'workbench',false);
    render();
  </script>
</body>
</html>
